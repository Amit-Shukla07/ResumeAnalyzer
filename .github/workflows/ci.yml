name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          echo "Running flake8 on src, tests, and evaluation..."
          flake8 src tests evaluation

  test:
    name: Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Synthetic Evaluation Benchmark
        run: |
          python evaluation/evaluate.py

      - name: Streamlit Headless AppTest Smoke Test
        env:
          STREAMLIT_SERVER_HEADLESS: "true"
        run: |
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('app.py').run(); assert not at.exception; print('✓ app.py executed cleanly via AppTest with 0 exceptions')"

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Report CI Results
        run: |
          STATUS="${{ needs.lint.result == 'success' && needs.test.result == 'success' && 'SUCCESS' || 'FAILURE' }}"
          echo "### CI Pipeline Run Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Flake8 Linting** | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pytest & Coverage Matrix** | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Overall CI Status** | **$STATUS** |" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "FAILURE" ]; then
            exit 1
          fi
